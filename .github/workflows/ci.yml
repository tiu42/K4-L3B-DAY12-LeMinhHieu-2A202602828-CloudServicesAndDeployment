# CI/CD — test → build → deploy lên Railway.
#
# Cần cấu hình trên GitHub (Settings → Secrets and variables → Actions):
#   Secrets:   RAILWAY_TOKEN     — Project Token (Railway → Project Settings → Tokens)
#   Variables: RAILWAY_SERVICE   — tên service trên Railway
#              PUBLIC_URL        — ví dụ https://l1lp3pp3r.up.railway.app

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push liên tiếp lên cùng một nhánh: hủy lần chạy cũ, chỉ giữ lần mới nhất
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài dependency
        run: pip install -r requirements.txt

      # Bỏ test_cp5 (cần bản deploy sống), test_bonus_cicd (tự tham chiếu badge)
      # và test cần Docker (job build lo phần đó).
      - name: Chạy pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >
          pytest tests -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Kiểm tra image khởi động được
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e PORT=8000 -e AGENT_API_KEY=ci-dummy -e REDIS_URL=redis://localhost:6379 \
            day12-agent:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs agent
          exit 1

  deploy:
    name: Deploy lên Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài Railway CLI
        run: npm install -g @railway/cli

      - name: railway up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service "${{ vars.RAILWAY_SERVICE }}"

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ vars.PUBLIC_URL }}/health"; then
              echo
              curl -fsS "${{ vars.PUBLIC_URL }}/ready"
              exit 0
            fi
            sleep 10
          done
          echo "service không trả /health sau 2 phút"
          exit 1
